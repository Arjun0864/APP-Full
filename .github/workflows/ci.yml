name: Full CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai_video_generator_backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend deps
        run: pip install -r requirements.txt
      - name: Backend compile check
        run: python -m compileall app
      - name: Backend image build check
        run: docker build -t ai-video-backend:ci .

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai_video_generator_source
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Flutter pub get
        run: flutter pub get
      - name: Flutter analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Flutter tests
        run: flutter test
      - name: Flutter build bundle
        run: flutter build bundle
