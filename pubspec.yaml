name: ai_video_generator
description: AI Video Generator - Premium Flutter App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── State & Navigation ────────────────────────────────────────────────────
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^13.2.5

  # ── UI ────────────────────────────────────────────────────────────────────
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  lottie: ^3.1.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  confetti: ^0.7.0
  glassmorphism: ^3.0.0
  blur: ^4.0.0
  animated_text_kit: ^4.2.2
  smooth_page_indicator: ^1.2.1
  flutter_staggered_animations: ^1.1.1
  percent_indicator: ^4.2.3

  # ── Firebase Auth ─────────────────────────────────────────────────────────
  firebase_core: ^3.13.1
  firebase_auth: ^5.7.0
  firebase_messaging: ^15.2.10
  google_sign_in: ^6.3.0
  sign_in_with_apple: ^6.1.4

  # ── Secure Storage (JWT token store karne ke liye) ────────────────────────
  flutter_secure_storage: ^9.2.4

  # ── Networking ────────────────────────────────────────────────────────────
  http: ^1.2.1
  # Certificate pinning ke liye
  http_certificate_pinning: ^3.0.1

  # ── Utilities ─────────────────────────────────────────────────────────────
  image_picker: ^1.0.7
  share_plus: ^7.2.2
  uuid: ^4.3.3
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  crypto: ^3.0.3
  device_info_plus: ^12.4.0
  image: ^4.8.0

  # ── Media Player (all formats) ───────────────────────────────────────────
  video_player: ^2.8.6
  chewie: ^1.13.1
  photo_view: ^0.15.0

  # ── File Tools ────────────────────────────────────────────────────────────
  file_picker: ^8.3.7
  open_filex: ^4.3.4
  path_provider: ^2.1.3
  permission_handler: ^11.4.0

  # ── Google Ads ────────────────────────────────────────────────────────────
  google_mobile_ads: ^9.0.0

  # ── Payments ─────────────────────────────────────────────────────────────
  # Razorpay for UPI/card payments
  # Run: flutter pub add razorpay_flutter
  # razorpay_flutter: ^1.3.6   # Uncomment after: flutter pub add razorpay_flutter

  # ── Keep screen on during generation ─────────────────────────────────────
  wakelock_plus: ^1.5.2
  desktop_drop: ^0.8.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  riverpod_generator: ^2.6.5
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
